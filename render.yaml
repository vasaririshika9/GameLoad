services:
  # Backend FastAPI Service on Render
  - type: web
    name: gameload-api
    env: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PUBLIC_LAUNCH_BASE_URL
        value: https://gameload.ai
      - key: ALLOWED_ORIGINS
        value: "*"
